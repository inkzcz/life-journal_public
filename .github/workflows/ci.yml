name: Public source checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''
      source_revision:
        type: string
        default: ''
      annotated_tag_sha:
        type: string
        default: ''
    outputs:
      artifact_name:
        value: ${{ jobs.docker-installation.outputs.artifact_name }}
permissions:
  contents: read
concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-and-tests:
    if: inputs.release_version != 'v5.1.9'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_DB: test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verified Gitleaks binary; fully redacted output
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Source gate including owner license decision
        run: python scripts/open_source_gate.py --require-license
      - name: All accessible history, redacted; no report upload
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history" --redact=100 --no-banner --no-color --log-level=error'
      - run: pip install -c backend/constraints-release.txt -r backend/requirements-test.txt
      - name: Complete exported PostgreSQL regression
        run: python -m pytest -q tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test@127.0.0.1:5432/test
      - name: Complete exported SQLite regression
        run: python -m pytest -q tests
      - name: Frontend tests, TypeScript and production build
        working-directory: frontend
        run: npm ci && node --test bundled-notices-check.mjs && npm test && npm run build
      - name: Four-container Compose contract with synthetic configuration only
        run: docker compose --env-file .env.example config --quiet
        env:
          POSTGRES_PASSWORD: synthetic-ci-test-only
          IMAGE_TAG: v5.1.9-candidate.ci
          POSTGRES_IMAGE: postgres:17-alpine
      - name: Tests must leave tracked source and example directories unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          python -c "from pathlib import Path; assert not Path('docs/v5.1.5/examples/travel-with-photos.zip').exists(), 'Unexpected generated source artifact'"
  docker-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build once, export one TAR and verify repeated local import
        id: identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          ANNOTATED_TAG_SHA: ${{ inputs.annotated_tag_sha }}
        run: |
          app_root="$GITHUB_WORKSPACE"
          revision=$(git rev-parse HEAD)
          tag="v5.1.9-candidate.${revision:0:7}"
          if [ -n "$RELEASE_VERSION" ]; then
            test "$RELEASE_VERSION" = v5.1.9
            test "$(git cat-file -t "$ANNOTATED_TAG_SHA")" = tag
            test "$(git rev-parse "$ANNOTATED_TAG_SHA^{commit}")" = "$SOURCE_REVISION"
            app_root="$RUNNER_TEMP/approved-tag-source"
            git worktree add --detach "$app_root" "$SOURCE_REVISION"
            revision=$(git -C "$app_root" rev-parse HEAD)
            tag="$RELEASE_VERSION"
          fi
          echo "APP_ROOT=$app_root" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "artifact_name=life-journal-delivery-$tag-$revision" >> "$GITHUB_OUTPUT"
          python "$app_root/scripts/release_local.py" --version "$tag" --revision "$revision" --output-dir "$RUNNER_TEMP/delivery"
          python scripts/image_private_keys.py --archive "$RUNNER_TEMP/delivery/$tag/life-journal-app-$tag-amd64.tar" > "$RUNNER_TEMP/layer-report.json"
          python -c "import json,sys; from pathlib import Path; m=json.loads(Path(sys.argv[1]).read_text()); print(json.dumps({k:m[k] for k in ('version','platform','tar_sha256','images')},indent=2))" "$RUNNER_TEMP/delivery/$tag/manifest.json"
      - name: Debian, PG17 tools, Caddy and privilege checks
        run: python tests/debian_image_probe.py --image-tag "$IMAGE_TAG" --output "$RUNNER_TEMP/debian-probe.json"
      - name: Current binary notices and integrity-verified npm and Go source evidence
        run: |
          python scripts/license_evidence.py --image-archive "$RUNNER_TEMP/delivery/$IMAGE_TAG/life-journal-app-$IMAGE_TAG-amd64.tar" --frontend-lock "$APP_ROOT/frontend/package-lock.json" --fetch-npm-archives --fetch-go-archives --retain-source-archives --output-dir "$RUNNER_TEMP/binary-evidence"
          python -c "import json,os; from pathlib import Path; d=json.loads((Path(os.environ['RUNNER_TEMP'])/'binary-evidence/inventory.json').read_text()); print(json.dumps({'binary_package_identities':[{k:p.get(k) for k in ('ecosystem','name','version','source_package')} for p in d['packages'] if p['ecosystem'] in ('deb','pypi')], 'caddy_go_version':d['go_version'],'go_modules':len(d['go_modules']),'bundled_native_libraries':d['bundled_native_libraries'],'corresponding_source_complete':d['corresponding_source_complete']},indent=2))"
      - name: Real BuildKit context excludes private files
        run: |
          python -m pip install 'pytest>=8,<10'
          TEST_BUILDX_BUILDER=default python -m pytest -q -p no:cacheprovider tests/test_docker_context.py
      - name: Prepare official database image separately from the business delivery
        run: docker pull postgres:17-alpine
      - name: Isolated installation, restart, backup, restore and synthetic upgrade
        run: python tests/docker_installation.py --image-tag "$IMAGE_TAG" --output "$RUNNER_TEMP/installation-report.json"
      - name: Exact corresponding source, patches and preferred browser source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/corresponding_sources.py --inventory "$RUNNER_TEMP/binary-evidence/inventory.json" --browser-notices "$RUNNER_TEMP/binary-evidence/image/srv/legal/browser-notices.json" --output "$RUNNER_TEMP/exact-sources"
      - name: Real LGPL Pillow shim source modification and relink
        run: python scripts/test_pillow_relink.py --image-tag "$IMAGE_TAG" --sources "$RUNNER_TEMP/exact-sources" --output "$RUNNER_TEMP/pillow-relink.json"
      - name: Bind one business TAR to complete sources, notices and validation
        run: |
          python scripts/prepare_distribution.py --root "$APP_ROOT" --orchestration-root . --bundle "$RUNNER_TEMP/delivery/$IMAGE_TAG" --evidence "$RUNNER_TEMP/binary-evidence" --sources "$RUNNER_TEMP/exact-sources" --installation "$RUNNER_TEMP/installation-report.json" --pillow "$RUNNER_TEMP/pillow-relink.json" --layers "$RUNNER_TEMP/layer-report.json" --debian "$RUNNER_TEMP/debian-probe.json" --output "$RUNNER_TEMP/release-assets"
      - name: Preserve only complete, explicitly named candidate delivery assets
        if: github.repository == 'inkzcz/life-journal_public' && ((github.event_name == 'push' && (github.ref == 'refs/heads/release/prepare-v5.1.9' || github.ref == 'refs/heads/main')) || (github.workflow == 'Formal v5.1.9 delivery' && inputs.release_version == 'v5.1.9' && inputs.source_revision != '' && inputs.annotated_tag_sha != ''))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          path: |
            ${{ runner.temp }}/release-assets/life-journal-app-${{ env.IMAGE_TAG }}-amd64.tar
            ${{ runner.temp }}/release-assets/life-journal-source-and-licenses-${{ env.IMAGE_TAG }}.tar.gz
            ${{ runner.temp }}/release-assets/life-journal-deploy-${{ env.IMAGE_TAG }}.zip
            ${{ runner.temp }}/release-assets/manifest.json
            ${{ runner.temp }}/release-assets/images.json
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt
            ${{ runner.temp }}/release-assets/INSTALL.md
            ${{ runner.temp }}/release-assets/UPGRADE.md
            ${{ runner.temp }}/release-assets/KNOWN_LIMITATIONS.md
            ${{ runner.temp }}/release-assets/RELEASE_NOTES.md
      - name: Safe validation summary only; no data or binary artifact upload
        run: |
          python -c "import json,os; from pathlib import Path; p=Path(os.environ['RUNNER_TEMP'])/'installation-report.json'; print(json.dumps(json.loads(p.read_text()),indent=2))" >> "$GITHUB_STEP_SUMMARY"
