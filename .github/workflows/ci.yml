name: Public source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_DB: test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verified Gitleaks binary; fully redacted output
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Source gate including owner license decision
        run: python scripts/open_source_gate.py --require-license
      - name: All accessible history, redacted; no report upload
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history" --redact=100 --no-banner --no-color --log-level=error'
      - run: pip install -r backend/requirements-test.txt
      - name: Complete exported PostgreSQL regression
        run: python -m pytest -q tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test@127.0.0.1:5432/test
      - name: Complete exported SQLite regression
        run: python -m pytest -q tests
      - name: Frontend tests, TypeScript and production build
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Four-container Compose contract with synthetic configuration only
        run: docker compose --env-file .env.example config --quiet
        env:
          POSTGRES_PASSWORD: synthetic-ci-test-only
          IMAGE_TAG: v5.1.9-candidate.ci
          POSTGRES_IMAGE: postgres:17-alpine
