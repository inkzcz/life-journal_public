name: Formal versioned delivery
on:
  push:
    tags: ['v5.1.12']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: formal-versioned-delivery
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'inkzcz/life-journal_public' && (github.event_name != 'push' || github.event.deleted != true)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      tag_sha: ${{ steps.identity.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Approved license and reviewed workflow gate
        run: python scripts/open_source_gate.py --require-license
      - name: Exact annotated tag, ordinary PR merge and completed main CI
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_preflight.py > "$RUNNER_TEMP/preflight.json"
          python -c "import json,os; from pathlib import Path; d=json.loads((Path(os.environ['RUNNER_TEMP'])/'preflight.json').read_text()); print('version='+d['version']); print('revision='+d['revision']); print('tag_sha='+d['tag_sha'])" >> "$GITHUB_OUTPUT"
  build:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      release_version: ${{ needs.preflight.outputs.version }}
      source_revision: ${{ needs.preflight.outputs.revision }}
      annotated_tag_sha: ${{ needs.preflight.outputs.tag_sha }}
    permissions:
      contents: read
  publish:
    outputs:
      publication_verified: ${{ steps.public-check.outputs.verified }}
    needs: [preflight, build]
    if: github.repository == 'inkzcz/life-journal_public' && (github.ref == 'refs/tags/v5.1.12' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: inkzcz/life-journal_public
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
      ANNOTATED_TAG_SHA: ${{ needs.preflight.outputs.tag_sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - name: Validate complete attachment allowlist and bound source before publication
        working-directory: ${{ runner.temp }}/release
        run: |
          python - <<'PY'
          import hashlib,json,os,re,tarfile
          from pathlib import Path
          v=os.environ['RELEASE_VERSION'];assert v=='v5.1.12'
          names={'life-journal-app-'+v+'-amd64.tar','life-journal-source-and-licenses-'+v+'.tar.gz','life-journal-deploy-'+v+'.zip','manifest.json','images.json','SHA256SUMS.txt','INSTALL.md','UPGRADE.md','KNOWN_LIMITATIONS.md','RELEASE_NOTES.md'}
          assert {p.name for p in Path('.').iterdir()}==names
          rows={}
          for line in Path('SHA256SUMS.txt').read_text().splitlines():
              sha,name=line.split('  ',1)
              assert re.fullmatch('[0-9a-f]{64}',sha) and name in names-{'SHA256SUMS.txt'} and name not in rows
              rows[name]=sha
          assert set(rows)==names-{'SHA256SUMS.txt'}
          for name,sha in rows.items():
              with Path(name).open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==sha
          m=json.loads(Path('manifest.json').read_text());images=json.loads(Path('images.json').read_text())
          assert m['version']==v and m['platform']=='linux/amd64' and m['source']['revision']==os.environ['RELEASE_REVISION']
          assert set(m['images'])=={'app'} and m['images']['app']['name']=='life-journal:'+v
          assert m['corresponding_source']['obligations_completed'] is True
          assert rows[m['corresponding_source']['file']]==m['corresponding_source']['sha256']
          with tarfile.open('life-journal-source-and-licenses-'+v+'.tar.gz') as archive:
              member=archive.getmember('life-journal-source-and-licenses/DISTRIBUTION_MANIFEST.json');assert member.size<8*1024**2
              d=json.load(archive.extractfile(member))
              for item in d['files']:
                  name=item['path'];assert not name.startswith('/') and '..' not in name.split('/')
                  with archive.extractfile('life-journal-source-and-licenses/'+name) as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==item['sha256']
              upgrade=json.load(archive.extractfile('life-journal-source-and-licenses/validation/same-schema-upgrade.json'))
          assert d['binary_redistribution_obligations_completed'] is True and d['source_commit']==os.environ['RELEASE_REVISION']
          assert d['business_tar_sha256']==rows['life-journal-app-'+v+'-amd64.tar']
          assert upgrade['synthetic_same_schema_upgrade']=='passed' and upgrade['source_commit']==os.environ['RELEASE_REVISION']
          PY
      - name: Create new draft Release with exactly the verified delivery
        working-directory: ${{ runner.temp }}/release
        run: |
          test "$RELEASE_VERSION" = v5.1.12
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_VERSION" --jq .object.sha)" = "$ANNOTATED_TAG_SHA"
          gh release create "$RELEASE_VERSION" --verify-tag --target "$RELEASE_REVISION" --title "Life Journal $RELEASE_VERSION" --notes-file RELEASE_NOTES.md --draft=true --prerelease=false "life-journal-app-$RELEASE_VERSION-amd64.tar" "life-journal-source-and-licenses-$RELEASE_VERSION.tar.gz" "life-journal-deploy-$RELEASE_VERSION.zip" manifest.json images.json SHA256SUMS.txt INSTALL.md UPGRADE.md KNOWN_LIMITATIONS.md RELEASE_NOTES.md
      - name: Download draft attachments and verify bytes, image identity and architecture
        run: |
          mkdir "$RUNNER_TEMP/downloaded"
          gh release download "$RELEASE_VERSION" --dir "$RUNNER_TEMP/downloaded"
          cd "$RUNNER_TEMP/downloaded"
          sha256sum --check SHA256SUMS.txt
          cmp SHA256SUMS.txt "$RUNNER_TEMP/release/SHA256SUMS.txt"
          python - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          v=os.environ['RELEASE_VERSION'];m=json.loads(Path('manifest.json').read_text())
          assert m['source']['revision']==os.environ['RELEASE_REVISION']
          with tarfile.open('life-journal-app-'+v+'-amd64.tar') as archive:
              rows=json.load(archive.extractfile('manifest.json'));assert len(rows)==1
              assert rows[0]['RepoTags']==['life-journal:'+v]
              raw=archive.extractfile(rows[0]['Config']).read();config=json.loads(raw)
              assert config['architecture']=='amd64' and config['os']=='linux'
              assert config['config']['Labels']['org.opencontainers.image.revision']==os.environ['RELEASE_REVISION']
              assert config['config']['Labels']['org.opencontainers.image.version']==v
              assert 'sha256:'+hashlib.sha256(raw).hexdigest()==m['images']['app']['config_digest']
          print(json.dumps({'release_download_verified':True,'platform':'linux/amd64','tar_sha256':m['tar_sha256']}))
          PY
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_VERSION" --jq .object.sha)" = "$ANNOTATED_TAG_SHA"
      - name: Publish verified draft as the formal Release
        run: |
          gh release edit "$RELEASE_VERSION" --draft=false --prerelease=false --latest
          gh release view "$RELEASE_VERSION" --json url,isDraft,isPrerelease,tagName
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = false
      - name: Anonymous public download verification of every formal attachment
        id: public-check
        working-directory: ${{ runner.temp }}/release
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          version=os.environ['RELEASE_VERSION'];assert version=='v5.1.12'
          expected={}
          for line in Path('SHA256SUMS.txt').read_text().splitlines():
              sha,name=line.split('  ',1);expected[name]=sha
          expected['SHA256SUMS.txt']=hashlib.sha256(Path('SHA256SUMS.txt').read_bytes()).hexdigest()
          assert len(expected)==10
          # Explicit anonymous requests; no token, cookies, database or raw logs.
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for name,sha in sorted(expected.items()):
              url='https://github.com/inkzcz/life-journal_public/releases/download/'+version+'/'+name
              for attempt in range(4):
                  try:
                      request=urllib.request.Request(url,headers={'User-Agent':'Life-Journal-public-integrity-check'})
                      with opener.open(request,timeout=120) as response:
                          assert response.status==200 and response.url.startswith('https://')
                          actual=hashlib.file_digest(response,'sha256').hexdigest()
                      assert actual==sha,'Public attachment checksum mismatch'
                      break
                  except (OSError,AssertionError):
                      if attempt==3:raise
                      time.sleep(5)
          print(json.dumps({'anonymous_downloads_verified':10,'all_sha256_match':True}))
          PY
          echo "verified=true" >> "$GITHUB_OUTPUT"
  cleanup-current-artifact:
    needs: [preflight, build, publish]
    if: needs.publish.outputs.publication_verified == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          persist-credentials: false
          sparse-checkout: scripts/release_artifact_cleanup.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Delete only this run's verified intermediary, preserve Release and other runs
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          DELIVERY_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
          PUBLICATION_VERIFIED: ${{ needs.publish.outputs.publication_verified }}
        run: python scripts/release_artifact_cleanup.py --repository "$GITHUB_REPOSITORY" --artifact-id "$DELIVERY_ARTIFACT_ID" --run-id "$GITHUB_RUN_ID" --name "$DELIVERY_ARTIFACT_NAME" --version "$RELEASE_VERSION" --revision "$RELEASE_REVISION" --publication-verified "$PUBLICATION_VERIFIED"
