# One delivered business image, host-managed PostgreSQL, four containers: DB → Maintenance → API → Web.
# Existing deployment data paths, role-local mounts, health and migration gates are retained.
services:
  db:
    # Prepare this PostgreSQL 17 image on the host before starting; never pull implicitly.
    image: ${POSTGRES_IMAGE:?Prepare an existing PostgreSQL 17 image on the host and set POSTGRES_IMAGE}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-life_journal}
      POSTGRES_USER: ${POSTGRES_USER:-life_journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a private database password}
    volumes:
    - ${DB_DATA_DIR:-./postgres}:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
    - appnet
  api:
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    image: life-journal:${IMAGE_TAG:?Set one immutable version or full commit SHA
      for the business image}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      MIGRATION_COORDINATOR: maintenance
      AUTO_MIGRATE_ON_STARTUP: ${AUTO_MIGRATE_ON_STARTUP:-true}
      MIGRATION_WAIT_SECONDS: ${MIGRATION_WAIT_SECONDS:-1800}
      POSTGRES_DB: ${POSTGRES_DB:-life_journal}
      POSTGRES_USER: ${POSTGRES_USER:-life_journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a private database password}
      SETUP_KEY: ${SETUP_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MEDIA_DIR: /data/media
      CONTAINER_ROLE: api
    volumes:
    - ${MEDIA_DATA_DIR:-./media}:/data/media
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',
        timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30m
    depends_on:
      db:
        condition: service_healthy
      maintenance:
        condition: service_healthy
    networks:
    - appnet
    command:
    - api
  maintenance:
    security_opt:
    - no-new-privileges:true
    image: life-journal:${IMAGE_TAG:?Set one immutable version or full commit SHA
      for the business image}
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-life_journal}
      POSTGRES_USER: ${POSTGRES_USER:-life_journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a private database password}
      MEDIA_DIR: /data/media
      BACKUP_ROOT: /backups
      AUTO_MIGRATE_ON_STARTUP: ${AUTO_MIGRATE_ON_STARTUP:-true}
      AUTO_MIGRATION_RETRY_TOKEN: ${AUTO_MIGRATION_RETRY_TOKEN:-}
      CONTAINER_ROLE: maintenance
    volumes:
    - ${MEDIA_DATA_DIR:-./media}:/data/media:ro
    - ${BACKUP_DATA_DIR:-./backup}:/backups
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - app.maintenance_health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30m
    depends_on:
      db:
        condition: service_healthy
    networks:
    - appnet
    command:
    - maintenance
  web:
    environment:
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},api,db,maintenance,web
      no_proxy: ${no_proxy:-localhost,127.0.0.1},api,db,maintenance,web
      CONTAINER_ROLE: web
    image: life-journal:${IMAGE_TAG:?Set one immutable version or full commit SHA
      for the business image}
    pull_policy: never
    restart: unless-stopped
    ports:
    - ${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-18080}:80
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -Y
      - 'off'
      - --spider
      - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
    - appnet
    command:
    - web
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    security_opt:
    - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '0'
networks:
  appnet: null
